</div>

<section class="section">

</div>

<div class="project-modal" id="project-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
  <div class="project-modal__backdrop" data-close-modal></div>
  <div class="project-modal__content">
    <button class="project-modal__close" type="button" aria-label="Close project details">&times;</button>
    <div class="project-modal__header">
      <h3 id="project-modal-title">Project</h3>
    </div>
    <div class="project-modal__carousel">
      <button class="project-modal__nav project-modal__nav--prev" type="button" aria-label="Previous image">&#10094;</button>
      <div class="project-modal__viewport">
        <img id="project-modal-image" src="" alt="Project preview">
      </div>
      <button class="project-modal__nav project-modal__nav--next" type="button" aria-label="Next image">&#10095;</button>
    </div>
    <div class="project-modal__dots" id="project-modal-dots"></div>
  </div>
</div>
